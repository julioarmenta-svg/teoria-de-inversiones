<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teoría de Inversiones - Tec de Monterrey</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f1f5f9; 
            padding: 40px 20px;
            color: #334155;
        }
        .container {
            max-width: 1240px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        header {
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
        }
        .tec-badge {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: #0033a0; /* Azul Tec */
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: #0f172a;
            line-height: 1.2;
        }
        .sub-docente {
            font-size: 14px;
            color: #64748b;
            font-weight: 400;
            margin-top: 6px;
        }
        h2.seccion-titulo {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 24px;
            padding-left: 4px;
        }
        .flujo-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background-color: #f8fafc;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }
        .flecha-separador {
            font-size: 28px;
            font-weight: 900;
            color: #cbd5e1;
            user-select: none;
        }
        .btn-3d {
            flex: 1;
            display: block;
            text-decoration: none;
            padding: 24px 16px;
            border-radius: 16px;
            color: #ffffff !important;
            text-align: center;
            font-weight: 800;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: transform 0.05s ease, border-bottom 0.05s ease;
        }
        .btn-3d:active {
            transform: translateY(4px);
        }
        .paso-num {
            display: block;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 4px;
            opacity: 0.9;
        }
        .paso-txt {
            display: block;
            font-size: 16px;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }
        /* Colores 3D */
        .azul-tec { background-color: #1e40af; border-bottom: 6px solid #1e3a8a; border-right: 1px solid #1d4ed8; }
        .azul-tec:hover { background-color: #2563eb; }
        .azul-tec:active { border-bottom: 2px solid #1e3a8a; }

        .verde-3d { background-color: #10b981; border-bottom: 6px solid #047857; border-right: 1px solid #059669; }
        .verde-3d:hover { background-color: #34d399; }
        .verde-3d:active { border-bottom: 2px solid #047857; }

        .morado-3d { background-color: #a855f7; border-bottom: 6px solid #7e22ce; border-right: 1px solid #9333ea; }
        .morado-3d:hover { background-color: #c084fc; }
        .morado-3d:active { border-bottom: 2px solid #7e22ce; }

        .naranja-3d { background-color: #f97316; border-bottom: 6px solid #c2410c; border-right: 1px solid #ea580c; }
        .naranja-3d:hover { background-color: #fb923c; }
        .naranja-3d:active { border-bottom: 2px solid #c2410c; }

        .rojo-3d { background-color: #f43f5e; border-bottom: 6px solid #be123c; border-right: 1px solid #e11d48; }
        .rojo-3d:hover { background-color: #fb7185; }
        .rojo-3d:active { border-bottom: 2px solid #be123c; }

        .footer-banner {
            margin-top: 48px;
            padding: 24px;
            background-color: #f8fafc;
            border-radius: 16px;
            border: 1px dashed #cbd5e1;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        @media (max-width: 992px) {
            .flujo-wrapper { flex-direction: column; gap: 16px; }
            .flecha-separador { transform: rotate(90deg); margin: 4px 0; }
            .btn-3d { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span class="tec-badge">Tec de Monterrey</span>
            <h1>Teoría de Inversiones</h1>
            <p class="sub-docente">Presentado por Julio Armenta</p>
        </header>

        <div>
            <h2 class="seccion-titulo">Módulos del Curso</h2>
            <div class="flujo-wrapper">
                <a href="semana1.html" class="btn-3d azul-tec">
                    <span class="paso-num">Módulo 01</span>
                    <span class="paso-txt">Semana 1</span>
                </a>
                <span class="flecha-separador">➔</span>
                <a href="semana2.html" class="btn-3d verde-3d">
                    <span class="paso-num">Módulo 02</span>
                    <span class="paso-txt">Semana 2</span>
                </a>
                <span class="flecha-separador">➔</span>
                <a href="semana3.html" class="btn-3d morado-3d">
                    <span class="paso-num">Módulo 03</span>
                    <span class="paso-txt">Semana 3</span>
                </a>
                <span class="flecha-separador">➔</span>
                <a href="semana4.html" class="btn-3d naranja-3d">
                    <span class="paso-num">Módulo 04</span>
                    <span class="paso-txt">Semana 4</span>
                </a>
                <span class="flecha-separador">➔</span>
                <a href="semana5.html" class="btn-3d rojo-3d">
                    <span class="paso-num">Módulo 05</span>
                    <span class="paso-txt">Semana 5</span>
                </a>
            </div>
        </div>

        <div class="footer-banner">
            💡 Seleccione una semana para revisar los materiales y sesiones correspondientes.
        </div>
    </div>
</body>
</html>
