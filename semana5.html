<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 5 - Teoría de Inversiones</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f1f5f9; 
            padding: 40px 20px;
            color: #334155;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        header {
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        .btn-regresar {
            display: inline-block;
            text-decoration: none;
            color: #64748b;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
        }
        .btn-regresar:hover { color: #1e40af; }
        h1 { font-size: 28px; color: #0f172a; }
        
        .lista-sesiones {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn-sesion {
            display: block;
            text-decoration: none;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 6px solid #1e40af;
            padding: 20px;
            border-radius: 12px;
            color: #334155;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        .btn-sesion:hover {
            background-color: #f1f5f9;
            transform: translateX(4px);
            border-left-color: #2563eb;
        }
        .btn-sesion.ae {
            border-left-color: #10b981;
        }
        .btn-sesion.ae:hover {
            border-left-color: #34d399;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="btn-regresar">⬅ Volver al Inicio</a>
            <h1>Semana 5: Contenido y Actividades</h1>
        </header>

        <div class="lista-sesiones">
            <a href="#" class="btn-sesion">• Sesión 5.1- Assessment / Evaluación Argumentativa</a>
            <a href="#" class="btn-sesion ae">• AI 2. Assessment / Evaluación argumentativa</a>
            <a href="#" class="btn-sesion">• Sesión 5.1- Examen Final</a>
            <a href="#" class="btn-sesion ae">• EXAMEN FINAL</a>
        </div>
    </div>
</body>
</html>
